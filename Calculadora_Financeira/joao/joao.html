<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style joao.css">
</head>

<body class="pagina">

    <h1>Simulador financeiro</h1>

    Insira seu nome <input type="text" id="ipt_nome" class="campo"> <br>
    Insira a quantidade de placas solares <input type="text" id="ipt_qtd_placas" class="campo"> <br>
    Selecione a região <select id="ipt_regiao" class="campo">
        <option value="19">Sul (média 19°C)</option>
        <option value="21">Sudeste (média 21°C)</option>
        <option value="24">Centro-Oeste (média 24°C)</option>
        <option value="26">Norte (média 26°C)</option>
        <option value="27">Nordeste (média 27°C)</option>
    </select> <br>
    <button onclick="calculo()" class="botao">Calcular</button> <br>
    <div id="div_exibir" class="resultado"></div>

</body>

<script>

    function calculo() {
        let ax_nome = ipt_nome.value;
        let ax_placas = Number(ipt_qtd_placas.value);
        let ax_temp = Number(ipt_regiao.value);
        let ax_porcet_graus = 0;

        if (ax_nome.length == 0) {

            alert("Preencha seu nome.");

        } else if (ipt_qtd_placas.value.length == 0) {

            alert("Preencha a quantidade de placas.");

        } else if (ax_placas <= 0) {

            alert("A quantidade de placas precisa ser maior que zero.");

        } else {

            if (ax_temp <= 25) {
                ax_porcet_graus = 0
            } else {
                ax_porcet_graus = (ax_temp - 25) * 0.35;
            }

            let ax_Moth_khw = 82.5;
            let ax_porcent_total = (15 + ax_porcet_graus) / 100;
            let ax_porcet_khw_moth = (ax_Moth_khw * ax_porcent_total);
            let ax_sem_empresa = (ax_placas * (ax_Moth_khw - ax_porcet_khw_moth));
            let ax_com_empresa = (ax_placas * ax_Moth_khw);
            let ax_sem_dinheiro = (ax_sem_empresa * 0.79);
            let ax_com_dinheiro = (ax_com_empresa * 0.79);
            let ax_diferenca = (ax_com_dinheiro - ax_sem_dinheiro);

            div_exibir.innerHTML += `Olá, ${ax_nome}! <br>
                Sem o nosso produto, você produziria ${ax_sem_empresa.toFixed()} kWh por mês, no valor de R$ ${ax_sem_dinheiro.toFixed(2)}. <br>
                Com o nosso produto, a produção seria de ${ax_com_empresa.toFixed()} kWh por mês, no valor de R$ ${ax_com_dinheiro.toFixed(2)}. <br>
                Ou seja, você economizaria R$ ${ax_diferenca.toFixed(2)} por mês! <br><br>`

        }

    }



</script>

</html>
